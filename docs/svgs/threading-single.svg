<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" font-family="-apple-system,system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="540" height="300" fill="#fafafa"/>
  <text x="270" y="22" text-anchor="middle" font-weight="600" font-size="15">Server(0) / ServerConfig{1,0} — single loop</text>

  <!-- Main thread box -->
  <rect x="40" y="45" width="460" height="220" fill="#fff" stroke="#666" rx="6"/>
  <text x="270" y="65" text-anchor="middle" font-weight="600" fill="#555">main thread (calls Server::run)</text>

  <!-- IOContext inside -->
  <rect x="60" y="85" width="200" height="160" fill="#e8f1fc" stroke="#5586c0" rx="4"/>
  <text x="160" y="108" text-anchor="middle" font-weight="600">IOContext loop</text>
  <text x="160" y="130" text-anchor="middle" fill="#555">epoll/kqueue/poll</text>
  <text x="160" y="150" text-anchor="middle" fill="#555">wait for fd readiness</text>
  <text x="160" y="174" text-anchor="middle" fill="#555">↓</text>
  <text x="160" y="196" text-anchor="middle" fill="#555">resume Task / call</text>
  <text x="160" y="216" text-anchor="middle" fill="#555">IoHandler inline</text>

  <!-- Work column -->
  <rect x="290" y="85" width="190" height="160" fill="#e8fcef" stroke="#4ca766" rx="4"/>
  <text x="385" y="108" text-anchor="middle" font-weight="600">work on this thread</text>
  <text x="385" y="132" text-anchor="middle" fill="#555">accept + UDP (loop 0)</text>
  <text x="385" y="152" text-anchor="middle" fill="#555">coroutine Tasks</text>
  <text x="385" y="172" text-anchor="middle" fill="#555">reactor IoHandlers</text>
  <text x="385" y="192" text-anchor="middle" fill="#555">timers / post()</text>
  <text x="385" y="220" text-anchor="middle" fill="#777" font-size="11">interleaved, never parallel</text>

  <line x1="260" y1="165" x2="290" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#arr-s)"/>

  <text x="270" y="288" text-anchor="middle" fill="#777" font-size="11">Same shape for coroutine and reactor when loops=1 and workers=0.</text>
</svg>
