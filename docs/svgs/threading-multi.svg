<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="-apple-system,system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="380" fill="#fafafa"/>
  <text x="310" y="22" text-anchor="middle" font-weight="600" font-size="15">Server(N) — 1 loop + N coroutine workers</text>

  <!-- IOContext at top -->
  <rect x="180" y="45" width="260" height="90" fill="#e8f1fc" stroke="#5586c0" rx="4"/>
  <text x="310" y="68" text-anchor="middle" font-weight="600">IOContext (one shared)</text>
  <text x="310" y="90" text-anchor="middle" fill="#555">epoll/kqueue + task queues</text>
  <text x="310" y="110" text-anchor="middle" fill="#555">reactor I/O stays on run() thread</text>

  <!-- Worker columns -->
  <rect x="40" y="180" width="120" height="150" fill="#fff" stroke="#666" rx="4"/>
  <text x="100" y="200" text-anchor="middle" font-weight="600">worker 0</text>
  <text x="100" y="226" text-anchor="middle" fill="#555">resume Task</text>
  <text x="100" y="246" text-anchor="middle" fill="#555">drain post()</text>
  <text x="100" y="266" text-anchor="middle" fill="#555">until next</text>
  <text x="100" y="286" text-anchor="middle" fill="#555">co_await</text>

  <rect x="180" y="180" width="120" height="150" fill="#fff" stroke="#666" rx="4"/>
  <text x="240" y="200" text-anchor="middle" font-weight="600">worker 1</text>
  <text x="240" y="226" text-anchor="middle" fill="#555">resume Task</text>
  <text x="240" y="246" text-anchor="middle" fill="#555">drain post()</text>
  <text x="240" y="266" text-anchor="middle" fill="#555">until next</text>
  <text x="240" y="286" text-anchor="middle" fill="#555">co_await</text>

  <rect x="320" y="180" width="120" height="150" fill="#fff" stroke="#666" rx="4"/>
  <text x="380" y="200" text-anchor="middle" font-weight="600">worker 2</text>
  <text x="380" y="226" text-anchor="middle" fill="#555">resume Task</text>
  <text x="380" y="246" text-anchor="middle" fill="#555">drain post()</text>
  <text x="380" y="266" text-anchor="middle" fill="#555">until next</text>
  <text x="380" y="286" text-anchor="middle" fill="#555">co_await</text>

  <rect x="460" y="180" width="120" height="150" fill="#fff" stroke="#666" rx="4"/>
  <text x="520" y="200" text-anchor="middle" font-weight="600">worker N-1</text>
  <text x="520" y="226" text-anchor="middle" fill="#555">resume Task</text>
  <text x="520" y="246" text-anchor="middle" fill="#555">drain post()</text>
  <text x="520" y="266" text-anchor="middle" fill="#555">until next</text>
  <text x="520" y="286" text-anchor="middle" fill="#555">co_await</text>

  <!-- Arrows from IOContext to each worker -->
  <line x1="240" y1="135" x2="100" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-m)"/>
  <line x1="290" y1="135" x2="240" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-m)"/>
  <line x1="330" y1="135" x2="380" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-m)"/>
  <line x1="380" y1="135" x2="520" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-m)"/>

  <text x="310" y="355" text-anchor="middle" fill="#777" font-size="11">Coroutine Tasks migrate across workers. Reactor on_readable/on_writable do not — use loops (see threading-reactor-loops.svg).</text>
</svg>
