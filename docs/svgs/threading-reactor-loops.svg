<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system,system-ui,sans-serif" font-size="13">
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-weight="600" font-size="15">ServerConfig{loops=N}  reactor accept-and-shard</text>

  <!-- Accept loop -->
  <rect x="240" y="40" width="240" height="90" fill="#e8f1fc" stroke="#5586c0" rx="4"/>
  <text x="360" y="62" text-anchor="middle" font-weight="600">loop 0 (accept)</text>
  <text x="360" y="84" text-anchor="middle" fill="#555">listen fd + UDP</text>
  <text x="360" y="104" text-anchor="middle" fill="#555">accept ’ round-robin target</text>
  <text x="360" y="120" text-anchor="middle" fill="#777" font-size="11">also runs its own pinned connections</text>

  <!-- Loops -->
  <rect x="40" y="180" width="150" height="180" fill="#fff4e1" stroke="#c08a45" rx="4"/>
  <text x="115" y="202" text-anchor="middle" font-weight="600">loop 0</text>
  <text x="115" y="226" text-anchor="middle" fill="#555">own PlatformIO</text>
  <text x="115" y="246" text-anchor="middle" fill="#555">own timers / reap</text>
  <text x="115" y="266" text-anchor="middle" fill="#555">conn A, D, &</text>
  <text x="115" y="290" text-anchor="middle" fill="#555">on_readable on</text>
  <text x="115" y="310" text-anchor="middle" fill="#555">this thread only</text>
  <text x="115" y="340" text-anchor="middle" fill="#777" font-size="11">workers_per_loop=0</text>

  <rect x="210" y="180" width="150" height="180" fill="#fff4e1" stroke="#c08a45" rx="4"/>
  <text x="285" y="202" text-anchor="middle" font-weight="600">loop 1</text>
  <text x="285" y="226" text-anchor="middle" fill="#555">own PlatformIO</text>
  <text x="285" y="246" text-anchor="middle" fill="#555">own timers / reap</text>
  <text x="285" y="266" text-anchor="middle" fill="#555">conn B, E, &</text>
  <text x="285" y="290" text-anchor="middle" fill="#555">on_readable on</text>
  <text x="285" y="310" text-anchor="middle" fill="#555">this thread only</text>
  <text x="285" y="340" text-anchor="middle" fill="#777" font-size="11">pinned at accept</text>

  <rect x="380" y="180" width="150" height="180" fill="#fff4e1" stroke="#c08a45" rx="4"/>
  <text x="455" y="202" text-anchor="middle" font-weight="600">loop 2</text>
  <text x="455" y="226" text-anchor="middle" fill="#555">own PlatformIO</text>
  <text x="455" y="246" text-anchor="middle" fill="#555">own timers / reap</text>
  <text x="455" y="266" text-anchor="middle" fill="#555">conn C, F, &</text>
  <text x="455" y="290" text-anchor="middle" fill="#555">on_readable on</text>
  <text x="455" y="310" text-anchor="middle" fill="#555">this thread only</text>
  <text x="455" y="340" text-anchor="middle" fill="#777" font-size="11">never migrates</text>

  <rect x="550" y="180" width="150" height="180" fill="#fff4e1" stroke="#c08a45" rx="4"/>
  <text x="625" y="202" text-anchor="middle" font-weight="600">loop N-1</text>
  <text x="625" y="226" text-anchor="middle" fill="#555">own PlatformIO</text>
  <text x="625" y="246" text-anchor="middle" fill="#555">own timers / reap</text>
  <text x="625" y="266" text-anchor="middle" fill="#555">conn &</text>
  <text x="625" y="290" text-anchor="middle" fill="#555">on_readable on</text>
  <text x="625" y="310" text-anchor="middle" fill="#555">this thread only</text>
  <text x="625" y="340" text-anchor="middle" fill="#777" font-size="11">post_to_io_thread</text>

  <!-- Arrows from accept to loops -->
  <line x1="300" y1="130" x2="115" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="340" y1="130" x2="285" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="380" y1="130" x2="455" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="420" y1="130" x2="625" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <text x="360" y="400" text-anchor="middle" fill="#777" font-size="11">Each connection is pinned to one IOContext for life. Server(N) workers do not scale reactor I/O  use loops.</text>
</svg>
